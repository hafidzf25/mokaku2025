<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flipbook MOKA-KU 2025</title>

<!-- StPageFlip CSS & JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/st-pageflip@1.0.6/dist/css/page-flip.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/st-pageflip@1.0.6/dist/js/page-flip.browser.min.js"></script>

<style>
body { margin:0; background:#f0f0f0; }
#flipbook-container { width:100%; max-width:900px; height:80vh; margin:20px auto; position:relative; }
#flipbook { width:100%; height:100%; }
#prevBtn, #nextBtn {
  position:absolute; top:50%; transform:translateY(-50%);
  z-index:10; background:rgba(0,0,0,0.3); color:white; border:none;
  padding:10px 15px; cursor:pointer; font-size:20px;
}
#prevBtn { left:0; } #nextBtn { right:0; }
</style>
</head>
<body>

<div id="flipbook-container">
  <div id="flipbook"></div>
  <button id="prevBtn">◀</button>
  <button id="nextBtn">▶</button>
</div>

<script>
// Container flipbook
const container = document.getElementById('flipbook');

// Array URL halaman
const totalPages = 66;
const pages = [];
for(let i=1;i<=totalPages;i++){
  const num = String(i).padStart(3,'0');
  pages.push(`https://raw.githubusercontent.com/hafidzf25/mokaku2025/main/booklet/BOOKLET%20PESERTA%20MOKA-KU%202025-page-${num}.jpg`);
}

// Inisialisasi StPageFlip
const flipbook = new St.PageFlip(container, {
  width: container.offsetWidth,
  height: container.offsetHeight,
  size: "stretch",
  drawShadow: true,
  flippingTime: 600,
  showCover: true,
});

// Load semua halaman
flipbook.loadFromImages(pages);

// Tombol prev/next
document.getElementById('prevBtn').onclick = () => flipbook.flipPrev();
document.getElementById('nextBtn').onclick = () => flipbook.flipNext();

// Responsive
window.addEventListener('resize', () => flipbook.update(container.offsetWidth, container.offsetHeight));
</script>

</body>
</html>
